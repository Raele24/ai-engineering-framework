name: Framework Validation & Test Suite

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-test:
    name: Validate Schemas, Adapters & Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify platform adapter synchronization
        run: python scripts/sync_adapters.py --check

      - name: Run framework integrity and secret validator
        run: python scripts/validate.py

      - name: Run automated unit and integration tests
        run: python -m unittest discover -s tests -v
