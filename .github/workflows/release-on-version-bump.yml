name: Auto-Deploy Release on Version Bump

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  check-version:
    name: Detect Version Bump & Parity
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      should_release: ${{ steps.ver.outputs.should_release }}

    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify version parity and check if tag exists
        id: ver
        run: |
          VERSION=$(python -c '
          import json, pathlib, re, sys, tomllib
          py_ver = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          init_txt = pathlib.Path("aief_cli/__init__.py").read_text(encoding="utf-8")
          m_init = re.search(r"__version__\s*=\s*\"([^\"]+)\"", init_txt)
          boot_txt = pathlib.Path("scripts/bootstrap.py").read_text(encoding="utf-8")
          m_boot = re.search(r"FRAMEWORK_VERSION\s*=\s*\"([^\"]+)\"", boot_txt)
          tpl_ver = json.loads(pathlib.Path("templates/project.framework.json").read_text(encoding="utf-8"))["frameworkVersion"]
          reg_ver = json.loads(pathlib.Path("skills/registry.json").read_text(encoding="utf-8"))["framework_version"]
          versions = {
              "pyproject.toml": py_ver,
              "aief_cli/__init__.py": m_init.group(1) if m_init else None,
              "scripts/bootstrap.py": m_boot.group(1) if m_boot else None,
              "templates/project.framework.json": tpl_ver,
              "skills/registry.json": reg_ver,
          }
          if len(set(versions.values())) != 1:
              print("VERSION_MISMATCH:", versions, file=sys.stderr)
              sys.exit(1)
          print(py_ver)
          ')
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "${TAG}"; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} already exists; skipping auto-deploy."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "New version ${TAG} detected; triggering release build."
          fi

  validate-and-build:
    name: Validate, Build Wheel & Smoke-Test CLI
    needs: check-version
    if: ${{ needs.check-version.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run full framework validation and tests
        run: |
          python scripts/sync_adapters.py --check
          python scripts/validate.py --mode framework
          python scripts/run_tests.py --fail-on-skip

      - name: Install build & twine
        run: python -m pip install --upgrade pip build twine

      - name: Build sdist and wheel
        run: |
          python -m build
          twine check dist/*

      - name: Smoke-test installed `aief` CLI from built wheel
        run: |
          python -m venv /tmp/aief-smoke-venv
          /tmp/aief-smoke-venv/bin/pip install dist/*.whl
          /tmp/aief-smoke-venv/bin/aief --version
          mkdir -p /tmp/aief-smoke-app
          /tmp/aief-smoke-venv/bin/aief init /tmp/aief-smoke-app --dry-run
          /tmp/aief-smoke-venv/bin/aief init /tmp/aief-smoke-app
          /tmp/aief-smoke-venv/bin/aief validate /tmp/aief-smoke-app --mode consumer
          /tmp/aief-smoke-venv/bin/aief compose /tmp/aief-smoke-app

      - name: Upload built package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-packages
          path: dist/*

  github-release:
    name: Create Git Tag & GitHub Release (${{ needs.check-version.outputs.tag }})
    needs: [check-version, validate-and-build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built distributions
        uses: actions/download-artifact@v4
        with:
          name: dist-packages
          path: dist

      - name: Generate SHA256 checksums and publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check-version.outputs.tag }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          sha256sum dist/* > dist/SHA256SUMS.txt
          gh release create "$TAG" dist/* \
            --title "AI Engineering Framework ${TAG}" \
            --notes "Automated release triggered by version bump to \`${VERSION}\` on \`main\`. Run this release via \`uvx --refresh --from git+https://github.com/${GITHUB_REPOSITORY}.git@${TAG} aief init .\` (or \`aief update .\`), or install/upgrade globally to latest \`main\` via \`pipx install --force git+https://github.com/${GITHUB_REPOSITORY}.git\` (pin \`@${TAG}\` for this exact tag)."

  publish-pypi:
    name: Publish to PyPI (OIDC Trusted Publisher)
    needs: [check-version, validate-and-build, github-release]
    if: ${{ vars.PYPI_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ai-engineering-framework

    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v4
        with:
          name: dist-packages
          path: dist

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
